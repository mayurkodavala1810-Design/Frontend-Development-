<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Learning</title>
</head>
<body style="background-color: black; color: white;">
    <div class="parant">
        <div class="day">Monday</div>
        <div class="day">Tuesday</div>
        <div class="day">Wednesday</div>
        <div class="day">Thursday</div>
    </div>
    <script>
        const parantDiv = document.querySelector('.parant');
        console.log(parantDiv);
        console.log(parantDiv.children);
        console.log(parantDiv.children[0].innerHTML);

        for(let i = 0; i < parantDiv.children.length; i++) {
            console.log(parantDiv.children[i].innerHTML);
        }

        parantDiv.children[0].style.color = 'red';
        parantDiv.children[1].style.color = 'orange';
        parantDiv.children[2].style.color = 'yellow';
        parantDiv.children[3].style.color = 'green';
        console.log(parantDiv.firstElementChild);
        console.log(parantDiv.lastElementChild);

        const day1 = document.querySelector('.day')
        /*console.log(day1);
        console.log(day1.parentElement);
        console.log(day1.nextElementSibling); */

        console.log("NODES : ",parantDiv.childNodes)
    </script>
</body>
</html>
