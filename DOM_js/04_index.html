<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Learning</title>
</head>
<body style="background-color: black; color: white;">
    <ul class="language">
        <li>JavaScript</li>
        <li>Python</li>
        <li>Java</li>
    </ul>
</body>
<script>
    function addLanguage(langName) {
        const li = document.createElement('li');
        li.innerHTML = `${langName}`;
        document.querySelector('.language').appendChild(li);
    }
    addLanguage('C++');
    addLanguage('C#');


    function addOptiLanguage(langName) {
        const li = document.createElement('li');
        li.appendChild(document.createTextNode(langName));
        document.querySelector('.language').appendChild(li);
    }
    addOptiLanguage('Go');
    

    // Edit
    //const secLang = document.querySelector("li:nth-child(1)").innerHTML = "JavaScript (ES6)";
    const newLi = document.createElement('li');
    newLi.textContent = "JavaScript (ES6)";
    const secondLi = document.querySelector("li:nth-child(1)");
    secondLi.replaceWith(newLi);


    // Edit
    const SecLi = document.querySelector("li:first-child")
    SecLi.outerHTML = "<li>TypeScript</li>"

    // Delete
    const thirdLi = document.querySelector("li:nth-child(2)");
    thirdLi.remove();


</script>
</html>
